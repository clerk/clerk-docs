enablePrePostScripts: true
minimumReleaseAge: 2880
overrides:
  '@astrojs/compiler': 1.8.2 # pinned: supply chain risk flagged by security tooling, request security review for upgrades
  '@sindresorhus/transliterate': 2.3.1
  # Security floors for transitive copies pnpm won't move on its own. Drop an entry once the parent
  # requires the fixed version itself.
  'prettier-plugin-svelte>svelte': ^5.55.7
  'vite>postcss': ^8.5.23
# Recreating a node_modules built under different settings prompts for confirmation and hard-fails
# without a TTY (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY) — which breaks any `pnpm <script>`
# run non-interactively (agents, CI) via pnpm's verify-deps-before-run. Purge without asking.
confirmModulesPurge: false
allowBuilds:
  '@parcel/watcher': false
  bun: true # downloads the bun binary; build scripts run via bun
  esbuild: false
